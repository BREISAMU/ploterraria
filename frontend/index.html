<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ploterraria</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #controls {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px 14px;
        font-family: monospace;
        font-size: 13px;
        color: #aaa;
      }

      #controls select {
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 3px 6px;
        font-family: monospace;
        font-size: 13px;
        cursor: pointer;
      }

      #controls button {
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 3px 10px;
        font-family: monospace;
        font-size: 13px;
        cursor: pointer;
      }

      #controls button:hover {
        background: #4a4a4a;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="controls">
        <label
          >X
          <select id="x-select"></select
        ></label>
        <label
          >Y
          <select id="y-select"></select
        ></label>
        <button id="generate-btn">Generate</button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
